<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <!-- Match the album WebP coordinates. All leather and chrome end before x=310. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="paper-grain" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect width="128" height="128" filter="url(#grain)"/>
    </pattern>
    <linearGradient id="paper-edge" x1="310" y1="0" x2="342" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="black"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="paper-only" maskUnits="userSpaceOnUse" x="310" y="0" width="1226" height="1024">
      <rect x="310" width="1226" height="1024" fill="url(#paper-edge)"/>
    </mask>
  </defs>
  <rect x="310" width="1226" height="1024" fill="url(#paper-grain)" mask="url(#paper-only)"/>
</svg>
