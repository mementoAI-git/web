# Sends a message to your Discord channel when someone pushes to dev or main.
# You must add your Discord webhook URL as a secret in GitHub (see README or instructions below).

name: Notify Discord on push

on:
  push:
    branches: [dev, main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Discord
        env:
          TITLE: "Push to ${{ github.ref_name }}"
          DESC: "**${{ github.actor }}** pushed to branch \`${{ github.ref_name }}\`\n\n**Commit:** \`${{ github.sha }}\`\n\n**Message:** ${{ github.event.head_commit.message }}"
        run: |
          payload=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            '{ content: null, embeds: [{ title: $title, description: $desc, color: 5814783 }] }')
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$payload"
