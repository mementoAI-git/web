# Sends a message to your Discord channel when someone pushes to dev or main.
# You must add your Discord webhook URL as a secret in GitHub (see README or instructions below).

name: Notify Discord on push

on:
  push:
    branches: [dev, main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Discord
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": null,
              "embeds": [{
                "title": "Push to ${{ github.ref_name }}",
                "description": "**${{ github.actor }}** pushed to branch `${{ github.ref_name }}`\n\n**Commit:** `${{ github.sha }}`\n\n**Message:** ${{ github.event.head_commit.message }}",
                "color": 5814783
              }]
            }'
