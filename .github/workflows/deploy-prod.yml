# ──────────────────────────────────────────────────────────────
# Frontend — Deploy to Production
# Triggers on push to main. Requires manual approval via the
# "production" GitHub environment before deploying.
# ──────────────────────────────────────────────────────────────
name: "Frontend: Deploy Prod"

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        type: string
        default: "Manual trigger"

concurrency:
  group: frontend-deploy-prod
  cancel-in-progress: false

jobs:
  # ── 1. Lint & Test ─────────────────────────────────────────
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  # ── 2. Build ───────────────────────────────────────────────
  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ secrets.PROD_VITE_API_BASE_URL }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_ENVIRONMENT: production

      - name: Check analytics is built in
        run: |
          if ! grep -rqs "phc_" dist/assets; then
            echo "::warning::PostHog key is missing from the build. Set the VITE_POSTHOG_KEY and VITE_POSTHOG_HOST repository secrets."
          fi

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html is missing — build failed"
            exit 1
          fi
          echo "Build output OK — $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1) total"

      # Artifacts count against the account's storage quota; the Actions cache does not.
      - name: Save build bundle
        uses: actions/cache/save@v4
        with:
          key: frontend-prod-${{ github.sha }}-${{ github.run_id }}
          path: dist/

  # ── 3. Deploy (requires manual approval) ───────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Restore build bundle
        uses: actions/cache/restore@v4
        with:
          key: frontend-prod-${{ github.sha }}-${{ github.run_id }}
          path: dist/
          fail-on-cache-miss: true

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Backup current deployment
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT || 22 }} \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
            'DEPLOY_DIR=/opt/memento/frontend-prod && \
             BACKUP_DIR=/opt/memento/backups/frontend-prod && \
             mkdir -p "$BACKUP_DIR" && \
             if [ -d "$DEPLOY_DIR" ] && [ "$(ls -A "$DEPLOY_DIR" 2>/dev/null)" ]; then \
               tar -cf "$BACKUP_DIR/$(date +%Y%m%d-%H%M%S).tar" -C "$DEPLOY_DIR" .; \
             fi && \
             ls -t "$BACKUP_DIR"/*.tar 2>/dev/null | tail -n +4 | xargs rm -f'

      - name: Rsync to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT || 22 }}" \
            ./dist/ \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/opt/memento/frontend-prod/

      # Hash every file in the local build and in the deploy directory,
      # compare. Fails if anything is missing, extra, or byte-different —
      # regardless of whether nginx is running.
      - name: Verify deployed tree matches build
        run: |
          hash_tree() {
            LC_ALL=C find . -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | awk '{print $1}'
          }

          LOCAL=$(cd dist && hash_tree)
          REMOTE=$(ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT || 22 }} \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
            'cd /opt/memento/frontend-prod && LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk "{print \$1}"')

          echo "local:  $LOCAL"
          echo "remote: $REMOTE"

          if [ -z "$LOCAL" ] || [ -z "$REMOTE" ]; then
            echo "::error::empty tree hash — one side has no files"
            exit 1
          fi
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::deployed tree hash does not match build (commit ${GITHUB_SHA})"
            exit 1
          fi
          echo "✓ deployed tree is byte-identical to the build"

      - name: Cleanup SSH credentials
        if: always()
        run: rm -rf ~/.ssh/deploy_key ~/.ssh/known_hosts

  # ── 4. Notify Discord of deploy outcome ────────────────────
  notify:
    name: Notify Discord
    needs: [quality, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post deploy outcome to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ENV_LABEL: Prod
          ENV_URL: https://app.mymemento.io
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi

          if [ "$DEPLOY_RESULT" = "success" ]; then
            title="Frontend ${ENV_LABEL} — Deploy succeeded ✅"
            color=3066993
            status="success"
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            title="Frontend ${ENV_LABEL} — Deploy failed ❌"
            color=15158332
            status="failure"
          elif [ "$DEPLOY_RESULT" = "cancelled" ]; then
            title="Frontend ${ENV_LABEL} — Deploy cancelled ⚠️"
            color=15844367
            status="cancelled"
          else
            title="Frontend ${ENV_LABEL} — Deploy skipped ⚠️"
            color=15844367
            status="skipped (quality=${QUALITY_RESULT}, build=${BUILD_RESULT})"
          fi

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          short_sha="${GITHUB_SHA:0:7}"
          msg="${COMMIT_MSG:-(no message)}"
          if [ ${#msg} -gt 900 ]; then msg="${msg:0:900}…"; fi

          payload=$(jq -n \
            --arg title "$title" \
            --arg status "$status" \
            --arg sha "$short_sha" \
            --arg actor "$GITHUB_ACTOR" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg run_url "$run_url" \
            --arg env_url "$ENV_URL" \
            --arg msg "$msg" \
            --argjson color "$color" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  { name: "Environment", value: $env_url, inline: true },
                  { name: "Branch",      value: $branch,  inline: true },
                  { name: "Commit",      value: $sha,     inline: true },
                  { name: "Actor",       value: $actor,   inline: true },
                  { name: "Status",      value: $status,  inline: true },
                  { name: "Message",     value: $msg,     inline: false },
                  { name: "Run",         value: $run_url, inline: false }
                ]
              }]
            }')

          response=$(curl -s -w "\n%{http_code}" -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Discord webhook failed (HTTP $http_code): $body"
            exit 1
          fi
          echo "Posted deploy outcome to Discord (HTTP $http_code)"
